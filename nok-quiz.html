<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НОК ГИП · Подготовка (7 уровень)</title>
  <style>
    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --border: #d0d7f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #4f46e5;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --radius: 16px;
      --shadow: 0 10px 40px -10px rgba(79, 70, 229, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #e0e7ff 0%, #f0f4ff 40%, #fdf4ff 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      padding: 20px 14px 60px;
    }
    .container { max-width: 740px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 22px; padding: 8px 0; }
    header h1 {
      font-size: 1.45rem; font-weight: 800;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    header p { color: var(--muted); font-size: 0.9rem; }
    .progress-wrap {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 16px; margin-bottom: 18px;
      display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);
    }
    .progress-bar { flex: 1; height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #4f46e5, #a78bfa);
      border-radius: 6px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 0.85rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px 24px; box-shadow: var(--shadow);
    }
    .q-num {
      display: inline-block; font-size: 0.78rem; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 5px 12px; border-radius: 20px; margin-bottom: 14px;
    }
    .q-text { font-size: 1.08rem; font-weight: 600; margin-bottom: 20px; color: #0f172a; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 15px; background: #f8fafc; border: 2px solid #e2e8f0;
      border-radius: 12px; cursor: pointer; transition: all 0.18s; user-select: none;
    }
    .option:hover:not(.disabled) { border-color: #a5b4fc; background: #eef2ff; }
    .option.correct { border-color: var(--green); background: var(--green-bg); }
    .option.wrong { border-color: var(--red); background: var(--red-bg); }
    .option.disabled { cursor: default; pointer-events: none; }
    .option input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; width: 18px; height: 18px; }
    .option span { flex: 1; font-size: 0.95rem; }
    .hint { margin-top: 12px; font-size: 0.82rem; color: var(--muted); font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    button {
      font-family: inherit; font-size: 0.95rem; font-weight: 700;
      padding: 12px 22px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.15s;
    }
    button:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { background: #fff; color: var(--text); border: 2px solid var(--border); }
    .btn-secondary:hover { border-color: #a5b4fc; background: #eef2ff; }
    .btn-retry-batch {
      background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
    }
    .result-msg {
      margin-top: 16px; padding: 12px 16px; border-radius: 10px;
      font-weight: 700; font-size: 0.95rem; display: none;
    }
    .result-msg.ok { display: block; background: var(--green-bg); color: var(--green); border: 1px solid #86efac; }
    .result-msg.fail { display: block; background: var(--red-bg); color: var(--red); border: 1px solid #fca5a5; }
    .finish { text-align: center; padding: 36px 16px; }
    .finish h2 { font-size: 1.6rem; margin-bottom: 8px; color: #4f46e5; }
    .finish .score { font-size: 1.15rem; font-weight: 700; margin: 12px 0 8px; }
    .finish p { color: var(--muted); margin-bottom: 20px; }
    footer { text-align: center; margin-top: 28px; font-size: 0.78rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>НОК · ГИП (7 уровень)</h1>
      <p>Специалист по организации строительства · 407 вопросов</p>
    </header>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>
    <div class="card" id="quizCard"></div>
    <footer>Прогресс сохраняется автоматически · только для личного использования</footer>
  </div>
<script>
const ALL_QUESTIONS = [{"id": 1, "text": "Какая характеристика объекта капитального строительства в соответствии с проектной документацией НЕ относит его к уникальным объектам?", "options": ["Высота более чем 100 метров", "Пролеты более чем 100 метров", "Высота для ветроэнергетических установок - более чем 200 метров", "Наличие консоли более чем 20 метров", "Заглубление подземной части (полностью или частично) ниже планировочной отметки земли более чем на 15 метров"], "correct": [2]}, {"id": 2, "text": "Каким путем осуществляется подтверждение факта соответствия комплектов рабочей документации требованиям действующих нормативных документов и утвержденной проектной документации?", "options": ["Визированием ответственного лица застройщика (технического заказчика) (специалиста по организации строительства) и простановки штампа \"В производство работ\" с датой на каждом листе комплектов рабочей документации", "Выдачей распоряжения о соответствии лицом, осуществляющим государственный строительный надзор", "Изданием приказа \"О подтверждении факта соответствия комплектов рабочей документации требованиям действующих нормативных документов и утвержденной проектной документации\" лицом, осуществляющим строительство", "Подписанием комплектов рабочей документации электронной подписью специалиста по организации строительства (при согласовании рабочей документации в форме электронных документов или в составе информационной модели)", "Составлением и подписанием акта о соответсnвии лицом, осуществляющим подготовку проектной документации"], "correct": [0, 3]}, {"id": 3, "text": "Кем осуществляется входной контроль рабочей документации на строительство объекта ?", "options": ["Застройщиком (техническим заказчиком)", "Лицом, осуществляющее подготовку проектной документации", "Лицом, осуществляющее строительство", "Лицом, осуществляющим государственный строительный надзор"], "correct": [0, 2]}, {"id": 4, "text": "Какие понятия включает в себя термин Реконструкция объектов капитального строительства (за исключением линейных объектов)?", "options": ["Изменение параметров объекта капитального строительства, его частей (высоты, количества этажей, площади, объема)", "Расширение объекта капитального строительства, а также замена и (или) восстановление несущих строительных конструкций объекта капитального строительства", "Надстройка объекта капитального строительства", "Замена систем инженерно-технического обеспечения и сетей инженерно-технического обеспечения объектов капитального строительства или их элементов", "Замена отдельных элементов несущих конструкций на аналогичные или иные улучшающие показатели таких конструкций элементы и (или) восстановления указанных элементов"], "correct": [0, 1, 2]}, {"id": 5, "text": "При капитальном ремонте объектов капитального строительства (за исключением линейных объектов) НЕ производится (выберите правильный вариант продолжения текста): Замена и (или) восстановление строительных конструкций или элементов таких конструкций Замена и (или) восстановление систем инженерно-технического обеспечения и сетей инженерно-технического обеспечения", "options": ["Восстановление несущих строительных конструкций", "Замена отдельных элементов несущих строительных конструкций на аналогичные"], "correct": [0]}, {"id": 6, "text": "Каким минимальным требованиям должно соответствовать заявление физического лица для включения сведений о физическом лице в национальные реестры специалистов? (выберите несколько вариантов правильных ответов)", "options": ["Наличие высшего образования по специальности или направлению подготовки в области строительства", "Наличие общего трудового стажа по профессии, специальности или направлению подготовки в области строительства не менее чем десять лет", "Наличие стажа работы на инженерных должностях не менее чем два года в организациях, выполняющих все виды строительной деятельности", "Наличие трудового стажа по профессии на административных должностях не менее чем пять лет"], "correct": [0, 1]}, {"id": 7, "text": "Физическое лицо для включения сведений о нём в национальный реестр специалистов в области строительства должно иметь стаж работы в организациях, выполняющих строительство, реконструкцию, капитальный ремонт, снос объектов капитального строительства на инженерных должностях не менее чем (выберите один вариант правильного ответа):", "options": ["Не менее трех лет", "Не менее пяти лет", "Не менее семи лет", "Не менее десяти лет"], "correct": [0]}, {"id": 8, "text": "В каком случае допускается выполнение капитального ремонта по проектной документации, не получившей положительное заключение экспертизы, при условии, что сметная стоимость такого капитального ремонта не подлежит проверке на предмет достоверности ее определения (выберите один вариант правильного ответа)?", "options": ["В случае капитального ремонта автомобильной дороги", "В случае капитального ремонта уникального объекта", "В случае капитального ремонта опасного производственного объекта", "В любом случае"], "correct": [3]}, {"id": 9, "text": "Какому наименованию основного комплекта рабочих чертежей соответствует марка «АИ» (выберите один вариант правильного ответа)?", "options": ["автоматизация инженерных систем", "интерьеры", "архитектурно-строительные решения", "архитектурные решения", "архитектурные индивидуальные изделия"], "correct": [1]}, {"id": 10, "text": "Какие сведения включают в состав общих указаний, приводимых в составе общих данных по рабочим чертежам основного комплекта марки АР (выберите несколько вариантов правильных ответов)?", "options": ["класс конструктивной пожарной опасности здания", "класс функциональной пожарной опасности здания", "сведения о мероприятиях по антикоррозионной защите конструкций (при отсутствии основного комплекта рабочих чертежей марки AЗ)", "сведения о глубине промерзания", "расчетный срок службы здания (сооружения)"], "correct": [0, 1, 4]}, {"id": 11, "text": "Какие главы, по которым распределяются средства, должен содержать сводный сметный расчет стоимости строительства, выполняемый в составе проектной документации на реконструкцию объекта капитального строительства (выберите несколько вариантов правильных ответов)?", "options": ["объекты транспортного хозяйства и связи (глава 5)", "благоустройство и озеленение территории (глава 7)", "временные здания и сооружения (глава 8)", "содержание службы заказчика, строительный контроль (глава 10)", "накладные расходы"], "correct": [0, 1, 2, 3]}, {"id": 12, "text": "Кем утверждаются изменения, внесённые в проектную документацию, получившую положительное заключение экспертизы (выберите один вариант правильного ответа)?", "options": ["Организацией, осуществлявшей экспертизу проектной документации", "Застройщиком, техническим заказчиком, лицом, ответственным за эксплуатацию здания, сооружения, или региональным оператором", "Лицом, осуществлявшим подготовку проектной документации", "Уполномоченным органом государственного строительного надзора", "Уполномоченным органом местной исполнительной власти"], "correct": [1]}, {"id": 13, "text": "Какие из нижеперечисленных зданий и сооружений относятся к некапитальным (выберите один вариант правильного ответа)?", "options": ["Строения, сооружения, которые не имеют прочной связи с землей и конструктивные ха-рактеристики которых позволяют осуществить их перемещение и (или) демонтаж и после-дующую сборку без несоразмерного ущерба назначению и без изменения основных характеристик", "Производственные, складские, вспомогательные, жилые и общественные здания и сооружения, необходимые для выполнения строительных работ", "Здания и сооружения, строительство которых не завершено", "Здания и сооружения, не требующие присоединения к сетям инженерно-технического обеспечения", "Какие из представленных видов саморегулируемых организаций предусмотрены Градостроительным кодексом РФ (выберите несколько вариантов правильных ответов)?", "Саморегулируемые организации, основанные на членстве лиц, выполняющих инженерные изыскания", "Саморегулируемые организации жниками с квалификационным разрядом не ниже пятого", "Рабочим, данные о котором внесены в журнал сварочных работ"], "correct": [1]}, {"id": 118, "text": "Какие работы из нижеперечисленных НЕ относится к работам, связанным с повышенной опасностью (выберите один вариант правильного ответа)?", "options": ["Работы с применением строительных машин в зонах санитарной охраны источников питьевого водоснабжения", "Работы на высоте", "Кровельные работы газопламенным способом", "Работы в непосредственной близости от проезжей части эксплуатируемых автомобильных дорог", "Пуск газа в газопроводы и другие объекты систем газоснабжения при вводе в эксплуатацию"], "correct": [0]}, {"id": 119, "text": "Каким документом подтверждается квалификация работника, выполняющего работы на высоте (выберите один вариант правильного ответа)?", "options": ["Аттестатом о среднем (общем) образовании", "Свидетельством о повышении квалификации", "Документом о профессиональном образовании (обучении)", "Дипломом об участии в профессиональном конкурсе"], "correct": [2]}, {"id": 120, "text": "При какой предельной скорости ветра не допускаются работы на высоте без наряда-допуска при монтаже (демонтаже) конструкций с большой парусностью (выберите один вариант правильного ответа)?", "options": ["При скорости ветра от 10 м/с и более", "При скорости ветра от 15 м/с и более", "При скорости ветра от 20 м/с и более", "При скорости ветра от 25 м/с и более"], "correct": [0]}, {"id": 121, "text": "При каком условии выдается наряд-допуск при выполнении работ в охранных зонах сооружений или коммуникаций (выберите один вариант правильного ответа)?", "options": ["При наличии письменного разрешения проектной организации", "При наличии письменного разрешения заказчика", "При наличии письменного разрешения организации-владельца этого сооружения или коммуникации", "При наличии письменного разрешения руководителя строительства", "При наличии устного разрешения руководителя строительства"], "correct": [2]}, {"id": 122, "text"  ["1,5 м", "1.8м", "2.5м"], "correct": [0]}, {"id": 177, "text": "В каких случаях разрешается производить строповку монтируемых элементов за выпуски арматуры (выберите один вариант правильного ответа)?", "options": ["Разрешается, если это указано в проекте производства работ (ППР)", "Разрешается, если нет возможности произвести строповку за монтажные петли", "Запрещается в любом случае", "Разрешается в любом случае"], "correct": [2]}, {"id": 178, "text": "Какие несчастные случаи на производстве обязательно оформляются актом по форме Н-1 (выберите один вариант правильного ответа)?", "options": ["Все случаи, даже не вызвавшие потери трудоспособности", "Случаи с потерей трудоспособности не менее чем на 1 день", "Все случаи, по которым рабочий обратился в медпункт", "Все случаи с потерей трудоспособности"], "correct": [1]}, {"id": 179, "text": "Какая минимальная высота должна быть у защитных ограждений, установленных на участках натяжения арматуры в местах прохода людей (выберите один вариант правильного ответа)?", "options": ["1,8м", "1,5м", "1,2м"], "correct": [0]}, {"id": 180, "text": "В чьи функции входит обеспечение безопасности труда на строительной площадке (выберите один вариант правильного ответа)?", "options": ["Застройщика (Технического заказчика)", "Лица, осуществляющего строительство", "Органов государственного строительного надзора", "Субподрядных организаций по выполняемым видам работ"], "correct": [1]}, {"id": 181, "text": "В чьи функции входит обеспечение условий безопасности населения при строительстве объекта (выберите один вариант правильного ответа)?", "options": ["Застройщика (Технического заказчика)", "Лица, осуществляющего строительство", "Органов местного самоуправления.", "Субподрядных организаций по выполняемым видам работ"], "correct": [1]}, {"id": 182, "text": "При каких условиях допускается оставлять на весу поднятые элементы конструкций и оборудования во время перерывов в работе (выберите один вариант правильного ответа)?", "options": ["До строящихся зданиях запрещается размещение временных складов (кладовых), мастерских и административно-бытовых помещений (выберите один вариант правильного ответа)?", "options": ["В деревянных зданиях", "В зданиях, имеющих не защищенные от огня несущие металлические конструкции и панели с горючими полимерными утеплителями", "В зданиях, не оснащённых внутренним противопожарным водопроводом", "В зданиях повышенного уровня ответственности", "В неотапливаемых зданиях"], "correct": [1]}, {"id": 202, "text": "На каком минимальном расстоянии от строящегося здания, временных зданий, сооружений и складов необходимо размещать отдельно стоящее сооружение, либо площадку для хранения с горючим утеплителем в соответствии с требованиями Постановления Правительства РФ от 16.09.2020 N 1479 \"Об утверждении Правил противопожарного режима в Российской Федерации\"? (выберите один вариант правильного ответа)", "options": ["5 метров", "18 метров", "25 метров", "50 метров"], "correct": [1]}, {"id": 203, "text": "При каком предельном количестве надземных этажей строящегося здания допускается применять деревянные леса, обработанные огнезащитными составами (выберите один вариант правильного ответа)?", "options": ["1 этаж", "2 этажа", "3 этажа", "4 этажа", "5 этажей"], "correct": [1]}, {"id": 204, "text": "Какие требования предъявляются к обустройству строительных лесов лестницами (стремянками) при производстве строительно-монтажных работ на объекте в соответствии с Постановлением Правительства РФ от 16.09.2020 N 1479 \"Об утверждении Правил противопожарного режима в Российской Федерации\"? (выберите один вариант правильного ответа)", "options": ["Строительные леса на каждые 10 метров по периметру построек необходимо оборудовать двумя лестницами или стремянками, но не менее чем 5 лестницами (стремянками) на все здание", "Строительные леса на каждые 40 метров по периметру построек необходимо оборудовать двумя лестницами или стремянками, но не менее чем 4 лестницами (стремянками) на все здание", "Строительные леса на каждые 10 метров по периметру построек необходимо оборудовать одной лестницей или стремянкой, но не менее чем 3 лестницами (стремянками) на все здание", "Строительные леса на каждые 40 метров по периметру построек необходимо оборудовать одной лестницей или стремянкой, но не менее чем 2 лестницами (стремянками) на все здание"], "correct": [3]}, {"id": 205, "text": "Какой при производстве огневых и сварочных работ, связанных с устройством гидро- и пароизоляции на кровле может быть предельная площадь участка работ (выберите один вариант правильного ответа)?", "options": ["Не более 500 метров квадратных", "400 метров квадратных", "300 метров квадратных", "200 метров квадратных", "100 метров квадратных"], "correct": [0]}, {"id": 206, "text": "В какой срок должен быть введён в действие противопожарный водопровод в строящемся производственном здании, если такой водопровод предусмотрен в проектной документации (выберите один вариант правильного ответа)?", "options": ["До начала отделочных работ", "До ввода объекта в эксплуатацию", "До начала работ по благоустройству", "До начала монтажа технологического оборудования", "До начала пуско-наладочных работ"], "correct": [0]}, {"id": 207, "text": "Какое предельное количество отдельных блок-контейнеров, используемых в качестве административно-бытовых помещений, допускается размещать в одной группе (выберите один вариант правильного ответа)?", "options": ["10 штук", "12 штук", "15 штук", "18 штук", "20 штук"], "correct": [0]}, {"id": 208, "text": "Какое максимальное количество этажей допускается при размещении отдельных блок-контейнеров, используемые в качестве административно-бытовых помещений (выберите один вариант правильного ответа)?", "options": ["1 этаж", "2 этажа", "3 этажа", "4 этажа"], "correct": [1]}, {"id": 209, "text": "В каких условиях необходимо производить составление и разбавление всех видов лаков и красок (выберите несколько вариантов правильных ответов)?", "options": ["В изолированных помещениях у наружной стены с оконными проемами", "На открытых площадках", "На рабочем месте при условии его оснащении 2 огнетушителями с минимальным рангом модельного очага пожара 2А, 55В", "На расстоянии не менее 10 м от места производства работ"], "correct": [0, 1]}, {"id": 210, "text": "Какими средствами пожаротушения должно быть обеспечено место варки битума (выберите несколько вариантов правильных ответов)?", "options": ["Топор", "Багор", "Огнетушителем не ниже ранга 2А", "2 лопаты", "Ящик с сухим песком"], "correct": [2, 3, 4]}, {"id": 211, "text": "Каким инструментом разрешается перемешивание разогретого битума и растворителя (выберите один вариант правильного ответа)?", "options": ["Миксером-насадкой (венчиком) с использованием электроинструмента класса 0 по степени безопасности", "Деревянной мешалкой", "Совковой лопатой", "Погружными верхнеприводными мешалками"], "correct": [1]}, {"id": 212, "text": "Какой минимальной высоты должна быть сплошная перегородка, ограждающая место для проведения сварочных и резательных работ на объектах, в конструкциях которых использованы горючие материалы (выберите один вариант правильного ответа)?", "options": ["1,2 м", "1,5 м", "1,8 м", "2,0 м", "2,2 м"], "correct": [2]}, {"id": 213, "text": "Какую операцию необходимо выполнить электросварщику при перерывах в работе (выберите один вариант правильного ответа)?", "options": ["Оградить рабочее место", "Отключить сварочную аппаратуру", "Вывесить предупредительную табличку", "Убрать рабочее место", "Выполнить запись в журнале сварочных работ"], "correct": [1]}, {"id": 214, "text": "В каких случаях при проведении газосварочных работ с карбидом кальция разрешается использовать один водяной затвор двум сварщикам (выберите один вариант правильного ответа)?", "options": ["В случае производства работ на открытых площадках", "В случае, если ниппели водяных затворов шланги плотно надеты, но не закреплены", "Запрещается во всех случаях", "Разрешается во всех случаях"], "correct": [2]}, {"id": 215, "text": "Каким образом запрещается соединять сварочные провода (выберите один вариант правильного ответа)?", "options": ["При помощи опрессовки", "При помощи сварки", "При помощи скрутки", "При помощи пайки"], "correct": [2]}, {"id": 216, "text": "С какой частотой следует осуществлять проверки параметров паяльных ламп (выберите один вариант правильного ответа)?", "options": ["Не реже 1 раза в 6 месяцев", "Не реже 1 раза в 3 месяца", "Не реже 1 раза в месяц", "Не реже 1 раза в 2 недели"], "correct": [2]}, {"id": 217, "text": "С какого момента начинается осуществление государственного строительного надзора (выберите один вариант правильного ответа)?", "options": ["С даты выдачи разрешения на строительство объекта капитального строительства", "С даты получения органом государственного строительного надзора извещения о начале работ", "С даты регистрации общего и специальных журналов работ в органе государственного строительного надзора", "С даты получения положительного заключения экспертизы проектной документации"], "correct": [1]}, {"id": 218, "text": "Какой документ выдается заказчику, застройщику или подрядчику должностным лицом органа государственного строительного надзора при выявлении нарушений в результате проведенной проверки (выберите один вариант правильного ответа)?", "options": ["Протокол об административном правонарушении организационно-правового порядка строительства", "Акт и предписание об устранении выявленных нарушений", "Распоряжение об устранении выявленных нарушений", "Уведомление о приостановлении работ"], "correct": [1]}, {"id": 219, "text": "Каким документом регламентируется периодичность и содержание проверок, проводимых органом государственного строительного надзора (выберите один вариант правильного ответа)?", "options": ["Приказом руководителя органа государственного строительного надзора", "Программой проведения проверок", "Договором между органом государственного строительного надзора и застройщиком (техническим заказчиком)", "Договором между органом государственного строительного надзора и лицом, осуществляющим строительство"], "correct": [1]}, {"id": 220, "text": "Каким образом должен поступить заказчик при обнаружении отступления от проекта, использования материалов и выполненных работ, качество которых не отвечает требованиям технических регламентов (выберите один вариант правильного ответа)?", "options": ["Выполнить запись в общем журнале работ о приостановке работ", "Принять решение о консервации объекта", "Оформить замечания о недостатках выполнения работ в письменной форме", "Оформить предписание о приостановке работ"], "correct": [2]}, {"id": 221, "text": "Какие состояния строительных объектов относятся к первой группе предельных состояний (укажите несколько вариантов правильных ответов)?", "options": ["Образование трещин, не нарушающих нормальную эксплуатацию строительного объекта", "Потеря устойчивости отдельных конструктивных элементов или сооружения в целом", "Качественное изменение конфигурации или переход в изменяемую систему", "Достижение предельных деформаций конструкций"], "correct": [1, 2]}, {"id": 222, "text": "Какие состояния строительных объектов относятся ко второй группе предельных состояний (укажите несколько вариантов правильных ответов)?", "options": ["Достижение предельных деформаций или предельных деформаций оснований", "Достижение предельных уровней колебаний конструкций или оснований, нарушающих нормальную работу оборудования", "Условия, при которых возникает необходимость прекращения эксплуатации", "Потеря устойчивости отдельных конструктивных элементов"], "correct": [0, 1]}, {"id": 223, "text": "При каком условии при строительстве опасного производственного объекта допускаются отклонения от проектной документации (выберите один вариант правильного ответа)?", "options": ["Не допускаются ни при каких условиях.", "Допускаются при условии строительства по специальным техническим условиям", "Допускаются при условии согласовании с уполномоченным органом Ростехнадзора", "Допускаются при условии их незначительности"], "correct": [0]}, {"id": 224, "text": "В каком случае должен выполняться повторный контроль за выполнением работ, которые оказывают влияние на безопасность объекта капитального строительств, если выполнение последующих работ, должно быть начато более чем через шесть месяцев со дня окончания проведения соответствующего контроля (выберите один вариант правильного ответа)?", "options": ["В случае, установленных распорядительным актом застройщика (технического заказчика)", "В случае, установленном договором на проведение авторского надзора", "В случае получения подрядчиком предписания органов государственного надзора", "В любом случае"], "correct": [3]}, {"id": 225, "text": "Какой критерий подлежит проверке при входном контроле рабочей документации (выберите один вариант правильного ответа)?", "options": ["Комплектность", "Компетентность проектной организации", "Достоверность расчетов несущих конструкций", "Наличие положительного заключения экспертизы"], "correct": [0]}, {"id": 226, "text": "Каким образом устраняются несоответствия, выявленные при входном контроле рабочей документации (выберите один вариант правильного ответа)?", "options": ["Оформляются в виде ведомости и передаются застройщиком (техническим заказчиком) проектной организации для устранения", "Устраняются в порядке авторского надзора специалистами проектной организации", "Устраняются строительной организацией и утверждаются застройщиком (техническим заказчиком)", "Оформляются застройщиком (техническим заказчиком) в виде изменений, вносимых в рабочую документацию в соответствии с требованиями государственных стандартов."], "correct": [0]}, {"id": 227, "text": "В процессе входного контроля рабочей документации проверяется… (выберите один правильный вариант продолжения текста)?", "options": ["Соответствие проектных технологических решений нормам технологического проектирования", "Полное или выборочное соответствие рабочей документации утвержденным решениям в составе проектной документации", "Достоверность расчетных параметров проектных решений", "Наличие положительного заключения экспертизы"], "correct": [1]}, {"id": 228, "text": "Лицо, осуществляющее строительство, в составе строительного контроля выполняет (выберите один вариант правильного продолжения текста):", "options": ["Проверку наличия на строительной площадке специалиста по организации строительства", "Входной контроль проектной документации, предоставленной застройщиком (техническим заказчиком", "Входной контроль рабочей документации, предоставленной застройщиком (техническим заказчиком", "Верификацию операционного контроля в ходе выполнения строительно-монтажных работ", "Извещение органов государственного надзора обо всех случаях аварийного состояния на объекте строительства"], "correct": [2]}, {"id": 229, "text": "Лицо, осуществляющее строительство, в составе строительного контроля выполняет входной контроль рабочей документации предоставленной…(выберите один вариант правильного продолжения текста):", "options": ["Застройщиком (техническим заказчиком)", "Инвестором", "Лицом, осуществляющим подготовку проектной документации", "Организацией государственной или негосударственной экспертизы"], "correct": [0]}, {"id": 230, "text": "При каком виде контроля проверяется соответствие границ строительной площадки на строительном генеральном плане установленным сервитутам (выберите один вариант правильного ответа)?", "options": ["При входном контроле проектной документации", "При входном контроле рабочей документации", "При геодезическом контроле", "При операционном контроле"], "correct": [0]}, {"id": 231, "text": "Какой вид контроля осуществляется при проверке ориентиров разбивочных осей, отметок дна котлована, элементов строительных конструкций после завершения работ предыдущего этапа (выберите один вариант правильного ответа)?", "options": ["Входной контроль", "Геодезический контроль", "Приемочный контроль", "Операционный контроль"], "correct": [0]}, {"id": 232, "text": "К какому виду контроля относится термин «верификация контроля» (выберите один вариант правильного ответа)?", "options": ["Постоянный контроль", "Периодический контроль", "Выборочный контроль", "Эпизодический контроль"], "correct": [2]}, {"id": 233, "text": "Когда определяются заданные технологические показатели качества бетонной смеси при входном контроле на строительной площадке (выберите один вариант правильного ответа)?", "options": ["При укладке бетонной смеси в конструкции", "По результатам испытания образцов в лабораторных условиях", "В процессе разгрузки из транспортного средства", "Не позднее чем через 20 минут после доставки бетонной смеси"], "correct": [3]}, {"id": 234, "text": "В каком возрасте проводят приемку партий бетонных смесей по прочности (выберите несколько вариантов правильных ответов)?", "options": ["В начальном", "В проектном", "В промежуточном", "В контрольном"], "correct": [1, 2]}, {"id": 235, "text": "Кем осуществляется приёмочный контроль при сварке монтажных соединений строительных конструкций (выберите один вариант правильного ответа)?", "options": ["Соответствующими службами генподрядчика (субподрядчика)", "Специалистом по организации строительства", "Специализированными испытательными лабораториями", "Застройщиком (техническим заказчиком)"], "correct": [2]}, {"id": 236, "text": "Для какой цели лицо, осуществляющее строительство, должно сохранить закрепленные в натуре разбивочные оси и монтажные ориентиры до момента завершения приемки отдельных конструкций (выберите один вариант правильного ответа)?", "options": ["Для возможности осуществления заказчиком контроля достоверности представленных исполнительных геодезических схем", "Для составления актов освидетельствования ответственных конструкций", "Для предъявления органу государственного строительного надзора при осуществлении им своих функций", "Для предъявления авторскому надзору"], "correct": [0]}, {"id": 237, "text": "Между какими участниками строительства заключается договор ведения авторского надзора на объекте строительства (выберите один вариант правильного ответа)?", "options": ["Между застройщиком (техническим заказчиком) и лицом, осуществляющее строительство", "Между лицом, осуществляющим подготовку проектной документации и лицом, осуществляющее строительство", "Между лицом, осуществляющим подготовку проектной документации и застройщиком (техническим заказчиком)", "Между инвестором и застройщиком (техническим заказчиком)"], "correct": [2]}, {"id": 238, "text": "В каком случае авторский надзор осуществляется в обязательном порядке (выберите один вариант правильного ответа)?", "options": ["При строительстве опасных производственных объектов", "При строительстве объектов с бюджетным финансированием", "По решению лица осуществившего подготовку проектной документации", "При строительстве мостов и тоннелей"], "correct": [0]}, {"id": 239, "text": "В каком порядке авторским надзором выполняется контроль за соблюдением технологии производства работ (выберите один вариант правильного ответа)?", "options": ["В порядке, определённым договором с генеральным подрядчиком", "В порядке выборочного контроля", "В порядке операционного контроля", "В порядке, установленном приказом по проектной организации"], "correct": [1]}, {"id": 240, "text": "В каких случаях специалисты авторского надзора имеют право приостанавливать своим решением производство строительно-монтажных работ (выберите один вариант правильного ответа)?", "options": ["Имеют право в случае выявленных отступлений от организационно-технологической до-кументации", "При выявлении критических строительных дефектов", "Имеют право в случае выявленных отступлений от проектной или рабочей документации", "Имеют право в случае невыполнения предписаний, занесённых в журнал авторского надзора"], "correct": [1]}, {"id": 241, "text": "Какой вид контроля качества строительно-монтажных работ не является видом производственного контроля (выберите один вариант правильного ответа)?", "options": ["Входной контроль рабочей документации", "Входной контроль применяемых строительных материалов, изделий, конструкций, полу-фабрикатов и оборудования", "Административный контроль исполнения нормативно-правовых актов", "Операционный контроль в ходе выполнения строительно-монтажных работ", "Контроль качества готовой строительной продукции"], "correct": [2]}, {"id": 242, "text": "Каким органом исполнительной власти устанавливается порядок проведения строительного контроля (выберите один вариант правильного ответа)?", "options": ["Правительством РФ", "Минстроем РФ", "Ростехнадзором", "Государственным строительным надзором"], "correct": [0]}, {"id": 243, "text": "К какому виду контроля относится проверка наличия указаний о методах контроля и измерений, в том числе в виде ссылок на соответствующие нормативные документы (выберите один вариант правильного ответа)?", "options": ["Входной контроль проектной документации", "Операционный контроль", "Приемочный контроль", "Контроль качества"], "correct": [0]}, {"id": 244, "text": "При каком условии индивидуальный предприниматель или юридическое лицо, не являющиеся застройщиком или техническим заказчиком, может принимать участие в строительном контроле (выберите один вариант правильного ответа)?", "options": ["Может при условии привлечения лицом, осуществляющим строительство", "Может при условии привлечения лицом, осуществляющем подготовку проектной документации", "Может при условии привлечения застройщиком или техническим заказчиком", "Может при условии привлечения местным органом исполнительной власти"], "correct": [2]}, {"id": 245, "text": "В каком случае заказчик может потребовать повторного освидетельствования скрытых работ после устранения, выявленных ранее дефектов (выберите один вариант правильного ответа)?", "options": ["В случае выявления критических строительных дефектов", "В случае получения предписания от представителей государственного строительного надзора", "Может в любом случае", "Не может ни в каком случае"], "correct": [2]}, {"id": 246, "text": "В каком документе отражаются все текущие результаты авторского надзора (выберите один вариант правильного ответа)?", "options": ["Дневник авторского надзора за строительством", "Журнал авторского надзора за строительством", "Договор авторского надзора за строительством с приложениями", "Акты результатов проверок"], "correct": [1]}, {"id": 247, "text": "Какой документ устанавливает порядок проведения строительного контроля (выберите один вариант правильного ответа)?", "options": ["Свод правил по организации строительного производства, утверждённый Минстроем РФ", "Положение о проведении строительного контроля, утверждённое Правительством РФ", "Государственный стандарт, утверждённый приказом Росстандарта", "Методические указания, утверждённые приказом Ростехнадзора"], "correct": [1]}, {"id": 248, "text": "В течение какого максимального периода после завершения приемки работ перед возобновлением их после перерыва не требуется выполнять повторно контроль с оформлением актов (выберите один вариант правильного ответа)?", "options": ["Менее 6 месяцев", "Менее 1 месяца", "Менее 1 года", "Менее 4 месяцев"], "correct": [0]}, {"id": 249, "text": "Перечень ответственных конструкций, подлежащих освидетельствованию, определяется… (выберите один вариант правильного продолжения текста)", "options": ["Проектной и рабочей документацией", "Сводами правил по организации строительства", "Государственными стандартами", "Техническими регламентами"], "correct": [0]}, {"id": 250, "text": "В каком из нижеперечисленных случаев авторский надзор лица, осуществляющего разработку проектной документации, является обязательным условием и не требует решения технического заказчика (застройщика) (выберите один вариант правильного ответа)?", "options": ["При проведении работ по сохранению объекта культурного наследия", "При строительстве жилых зданий", "При строительстве большепролетных зданий", "При строительстве объектов транспортной инфраструктуры"], "correct": [0]}, {"id": 251, "text": "По каким параметрам осуществляется входной контроль строительных материалов (выберите один вариант правильного ответа)?", "options": ["По параметрам, установленных в технических регламентах, документах в области стандартизации и рабочей документации", "По параметрам, установленным в программе пусконаладочных работ", "По параметрам, регламентированным в результатах инженерно-геологических изысканий", "По параметрам, установленных в технологической документации"], "correct": [0]}, {"id": 252, "text": "Контроль в процессе строительства за соответствием применяемых строительных материалов и изделий требованиям проектной документации должен осуществляться… (выберите одно правильное продолжение текста)", "options": ["Лицом, осуществляющим строительство", "Застройщиком (техническим заказчиком)", "Национальным органом по стандартизации", "Лицом, осуществляющем технический надзор"], "correct": [0]}, {"id": 253, "text": "Какие требования подлежат контролю при усилении каменной кладки каменных конструкций реконструируемых и поврежденных зданий (укажите несколько вариантов правильных ответов (выберите один вариант правильного ответа)?", "options": ["Качество подготовки проекта по усилению", "Соответствие конструкций усиления проекту", "Качество сварки крепежных деталей после напряжения элементов конструкций", "Наличие и качество антикоррозионной защиты конструкций усиления"], "correct": [1, 2, 3]}, {"id": 254, "text": "В какой форме оформляются замечания авторского надзора (выберите один вариант правильного ответа)?", "options": ["По электронной почте", "В форме телефонограммы", "В произвольной письменной форме", "В любой форме, обеспечивающей надлежащее уведомление"], "correct": [2]}, {"id": 255, "text": "Какая документация должна быть представлена при приемочном контроле качества строительно-монтажных работ (укажите несколько вариантов правильных ответов)?", "options": ["Акты освидетельствования скрытых работ", "Акты промежуточной приемки ответственных конструкций", "Акты стоимости выполненных работ", "Акты проверки устойчивости конструкций"], "correct": [0, 1]}, {"id": 256, "text": "В каких случаях разрешается использование новых материалов, изделий, конструкций, требования к которым НЕ регламентированы действующими государственными стандартами, техническими условиями и другими нормативными документами, без подтверждения их пригодности для применения в условиях строительства (выберите один вариант правильного ответа)?", "options": ["Разрешается в любых случаях", "Разрешается к применению после подтверждения их пригодности для применения в условиях строительства объектов на территории РФ", "Разрешается при включении в спецификации в составе рабочей документации", "Разрешается по решению застройщика (технического заказчика)"], "correct": [1]}, {"id": 257, "text": "Какие сведения указываются в рабочих чертежах конструкций (КМ и КМД) и в документации на заказ материалов (выберите несколько вариантов правильных ответов)?", "options": ["Стали и требования к ним", "Способ выполнения сварных соединений, тип (способ) сварки; типы, марки, диаметры электродов, положение шва при сварке, тип подкладки для стыковых швов", "Несущая способность стальных конструкций", "Требования к защите конструкций от коррозии"], "correct": [0, 1, 3]}, {"id": 258, "text": "Какой вид потерь строительных материалов, возникающих при транспортировке, хранении и отпуске на складе вследствие их физико-химических свойств, НЕ относится к трудно-устранимым (выберите один вариант правильного ответа)?", "options": ["Раструска и распыление при погрузочно-разгрузочных операциях", "Усушка и выветривание (улетучивание, вымерзание, испарение) содержащейся в продукции влаги", "Потери при раскрое листовых материалов", "Утечка при перекачивании из одной тары в другую, просачивание через тару либо впитывание в нее"], "correct": [2]}, {"id": 259, "text": "Какое значение должна быть у минимальной прочности бетона при распалубке незагруженных монолитных горизонтальных конструкций при пролете свыше 6м (выберите один вариант правильного ответа)?", "options": ["Не менее 50% от проектной прочности", "Не менее 60% от проектной прочности", "Не менее 70% от проектной прочности", "Не менее 80% от проектной прочности", "Не менее 100% от проектной прочности"], "correct": [3]}, {"id": 260, "text": "В обозначении класса бетона по прочности на сжатие В число обозначает… (выберите один правильный вариант продолжения текста)", "options": ["Значение кубиковой прочности на сжатие, МПа", "Значение нормативной прочности бетона на сжатие, кгс/м3", "Марку бетона, выраженную в 1000 кН/м3", "Предел прочности на сжатие, Н/мм3"], "correct": [0]}, {"id": 261, "text": "Какому определению соответствует термин «деградация свойств материалов во времени» (выберите один вариант правильного ответа)?", "options": ["Постепенное понижение уровня эксплуатационных характеристик материалов, процесс их изменения в сторону ухудшения относительно проектных значений", "Способность материалов сохранять прочностные, физические и другие свойства, устанав-ливаемые при проектировании и обеспечивающие его нормальную эксплуатацию в течение расчетного срока службы", "Способность материалов выполнять требуемые функции в течение расчетного срока эксплуатации", "Состояние материалов, при котором не выполняются одно или несколько условий предельных состояний"], "correct": [0]}, {"id": 262, "text": "Какое определение соответствует термину «марка бетона по водонепроницаемости» (выберите один вариант правильного ответа)?", "options": ["Показатель проницаемости бетона, характеризующийся отношением количества поглощенной воды к массе бетона", "Показатель проницаемости бетона, характеризующийся максимальным водонасыщением", "Показатель проницаемости бетона, характеризующийся максимальным давлением воды, при котором в условиях стандартных испытаний вода не проникает через бетонный образец", "Минимальное число циклов замораживания и оттаивания образцов бетона"], "correct": [2]}, {"id": 263, "text": " т правильного ответа)?", "options": ["На максимальное и минимальное давление", "На прочность и герметичность", "На соответствие проектным параметрам", "На грунтовые условия"], "correct": [1]}, {"id": 267, "text": "В каких условиях должны храниться фасадные облицовочные и кровельные конструкции с офактуренной и другой финишной отделкой (выберите один вариант правильного ответа)?", "options": ["В неотапливаемом складском помещении с твердым покрытием пола", "В отапливаемом складском помещении с твердым покрытием пола", "На открытой складской площадке", "Под навесом"], "correct": [0]}, {"id": 268, "text": "Какого минимального размера должна быть толщина прокладки при штабелировании материалов при наличии в них выступающих строповочных петель (выберите один вариант правильного ответа)?", "options": ["Толщина прокладки должна не менее чем на 30 мм превышать высоту строповочных петель", "Толщина прокладки должна не менее чем на 20 мм превышать высоту строповочных петель", "Толщина прокладки должна не менее чем на 10 мм превышать высоту строповочных петель", "Толщина прокладки должна превышать высоту строповочных петель"], "correct": [1]}, {"id": 269, "text": "Какая допускается максимальная высота штабеля панелей металлических лёгких ограждающих конструкций в заводской упаковке при временном хранении на открытой площадке (выберите один вариант правильного ответа)?", "options": ["Не более 2,0 м", "Не более 2,5 м", "Не более 3 м", "Не более 3,2м"], "correct": [1]}, {"id": 270, "text": "Какая предельная продолжительность хранения высокопрочной проволочной арматуры, арматурных и стальных канатов в закрытых помещениях (выберите один вариант правильно-го ответа)?", "options": ["1 год", "1,5 года", "2 года", "3 года", "5 лет"], "correct": [0]}, {"id": 271, "text": "Кем устанавливается перечень видов строительных и монтажных работ, ответственных конструкций, участков сетей инженерно-технического обеспечения, подлежащих освидетельствованию с составлением соответствующих актов прием const STORAGE_KEY = 'nok_gip_quiz_v3';

let state = {
  mode: 'main',
  current: 0,
  answered: {},
  wrongIds: [],
  queue: []
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.current = p.current || 0;
      state.answered = p.answered || {};
      state.wrongIds = p.wrongIds || [];
      state.mode = p.mode || 'main';
      state.queue = p.queue || ALL_QUESTIONS.map(q => q.id);
    } else {
      state.queue = ALL_QUESTIONS.map(q => q.id);
    }
  } catch(e) {
    state.queue = ALL_QUESTIONS.map(q => q.id);
  }
  if (state.current >= state.queue.length) state.current = Math.max(0, state.queue.length - 1);
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    current: state.current,
    answered: state.answered,
    wrongIds: state.wrongIds,
    mode: state.mode,
    queue: state.queue
  }));
}

function getQById(id) {
  return ALL_QUESTIONS.find(q => q.id === id);
}

const card = document.getElementById('quizCard');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

function updateProgress() {
  const total = state.queue.length;
  const done = state.current;
  const pct = total ? Math.round((done / total) * 100) : 0;
  progressFill.style.width = pct + '%';
  const label = state.mode === 'retry' ? 'Повтор ошибок' : 'Основной';
  progressText.textContent = done + ' / ' + total + ' · ' + label;
}

function render() {
  updateProgress();

  if (state.current >= state.queue.length) {
    const correctCount = Object.keys(state.answered).length;
    const totalAll = ALL_QUESTIONS.length;
    const wrongs = state.wrongIds.filter(id => !state.answered[id]);

    if (state.mode === 'main' && wrongs.length > 0) {
      card.innerHTML = `
        <div class="finish">
          <h2>Основной проход завершён</h2>
          <div class="score">Правильно: ${correctCount} из ${totalAll}</div>
          <p>Ошибок: <strong>${wrongs.length}</strong></p>
          <div class="actions" style="justify-content:center">
            <button class="btn-retry-batch" onclick="startRetry()">Прорешать ошибочные (${wrongs.length})</button>
            <button class="btn-secondary" onclick="resetAll()">Начать всё заново</button>
          </div>
        </div>`;
      return;
    }

    card.innerHTML = `
      <div class="finish">
        <h2>${state.mode === 'retry' ? 'Повтор завершён!' : 'Все вопросы пройдены!'}</h2>
        <div class="score">Правильно: ${correctCount} / ${totalAll}</div>
        <p>${wrongs.length ? 'Ещё остались ошибки.' : 'Отличный результат!'}</p>
        <div class="actions" style="justify-content:center">
          ${wrongs.length ? `<button class="btn-retry-batch" onclick="startRetry()">Прорешать ошибочные (${wrongs.length})</button>` : ''}
          <button class="btn-primary" onclick="resetAll()">Начать всё заново</button>
        </div>
      </div>`;
    return;
  }

  const qid = state.queue[state.current];
  const q = getQById(qid);
  if (!q) { state.current++; render(); return; }

  const isMulti = q.correct.length > 1;
  const type = isMulti ? 'checkbox' : 'radio';
  const name = 'opt_' + q.id;

  let optionsHtml = q.options.map((opt, i) => `
    <label class="option" data-idx="${i}">
      <input type="${type}" name="${name}" value="${i}">
      <span>${opt}</span>
    </label>`).join('');

  card.innerHTML = `
    <div class="q-num">${state.mode === 'retry' ? 'Повтор · ' : ''}Вопрос ${state.current + 1} из ${state.queue.length}</div>
    <div class="q-text">${q.text}</div>
    <div class="options">${optionsHtml}</div>
    ${isMulti ? '<div class="hint">Можно выбрать несколько вариантов</div>' : ''}
    <div class="result-msg" id="resultMsg"></div>
    <div class="actions">
      <button class="btn-primary" id="checkBtn" onclick="checkAnswer()">Проверить</button>
      <button class="btn-secondary" id="nextBtn" style="display:none" onclick="nextQuestion()">Далее →</button>
    </div>`;
}

function checkAnswer() {
  const qid = state.queue[state.current];
  const q = getQById(qid);
  const inputs = card.querySelectorAll('input');
  const selected = [];
  inputs.forEach(inp => { if (inp.checked) selected.push(+inp.value); });

  if (selected.length === 0) { alert('Выберите хотя бы один вариант'); return; }

  const sel = [...selected].sort((a,b)=>a-b);
  const cor = [...q.correct].sort((a,b)=>a-b);
  const isCorrect = sel.length === cor.length && sel.every((v,i) => v === cor[i]);

  card.querySelectorAll('.option').forEach(lab => {
    lab.classList.add('disabled');
    const idx = +lab.dataset.idx;
    const wasSel = selected.includes(idx);
    const isRight = q.correct.includes(idx);
    if (isRight) lab.classList.add('correct');
    else if (wasSel) lab.classList.add('wrong');
  });

  const msg = document.getElementById('resultMsg');
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';

  if (isCorrect) {
    msg.className = 'result-msg ok';
    msg.textContent = 'Верно!';
    state.answered[q.id] = true;
    state.wrongIds = state.wrongIds.filter(id => id !== q.id);
  } else {
    msg.className = 'result-msg fail';
    msg.textContent = 'Неверно';
    if (!state.wrongIds.includes(q.id)) state.wrongIds.push(q.id);
  }
  saveState();
  updateProgress();
}

function nextQuestion() {
  state.current++;
  saveState();
  render();
}

function startRetry() {
  const wrongs = state.wrongIds.filter(id => !state.answered[id]);
  if (wrongs.length === 0) { alert('Нет ошибочных вопросов'); return; }
  state.mode = 'retry';
  state.queue = [...wrongs];
  state.current = 0;
  saveState();
  render();
}

function resetAll() {
  if (!confirm('Сбросить весь прогресс и начать сначала?')) return;
  state = {
    mode: 'main',
    current: 0,
    answered: {},
    wrongIds: [],
    queue: ALL_QUESTIONS.map(q => q.id)
  };
  saveState();
  render();
}

loadState();
render();
</script>
</body>
</html>
