<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>НОК ГИП · 411 вопросов</title>
<style>
:root {
  --bg:#f0f4ff; --card:#fff; --border:#d0d7f0; --text:#1e293b; --muted:#64748b;
  --accent:#4f46e5; --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2;
  --radius:16px; --shadow:0 10px 40px -10px rgba(79,70,229,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#e0e7ff 0%,#f0f4ff 40%,#fdf4ff 100%);color:var(--text);min-height:100vh;line-height:1.55;padding:20px 14px 60px}
.container{max-width:740px;margin:0 auto}
header{text-align:center;margin-bottom:22px;padding:8px 0}
header h1{font-size:1.45rem;font-weight:800;background:linear-gradient(90deg,#4f46e5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
header p{color:var(--muted);font-size:.9rem}
.progress-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.progress-bar{flex:1;height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#a78bfa);border-radius:6px;transition:width .4s ease}
.progress-text{font-size:.85rem;font-weight:600;color:var(--accent);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 24px;box-shadow:var(--shadow)}
.q-num{display:inline-block;font-size:.78rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:5px 12px;border-radius:20px;margin-bottom:14px}
.q-text{font-size:1.08rem;font-weight:600;margin-bottom:20px;color:#0f172a}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;cursor:pointer;transition:all .18s;user-select:none}
.option:hover:not(.disabled){border-color:#a5b4fc;background:#eef2ff}
.option.correct{border-color:var(--green);background:var(--green-bg)}
.option.wrong{border-color:var(--red);background:var(--red-bg)}
.option.disabled{cursor:default;pointer-events:none}
.option input{margin-top:3px;accent-color:var(--accent);flex-shrink:0;width:18px;height:18px}
.option span{flex:1;font-size:.95rem}
.hint{margin-top:12px;font-size:.82rem;color:var(--muted);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
button{font-family:inherit;font-size:.95rem;font-weight:700;padding:12px 22px;border:none;border-radius:10px;cursor:pointer;transition:all .15s}
button:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:#fff;color:var(--text);border:2px solid var(--border)}
.btn-secondary:hover{border-color:#a5b4fc;background:#eef2ff}
.btn-retry-batch{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;box-shadow:0 4px 14px rgba(234,88,12,.3)}
.result-msg{margin-top:16px;padding:12px 16px;border-radius:10px;font-weight:700;font-size:.95rem;display:none}
.result-msg.ok{display:block;background:var(--green-bg);color:var(--green);border:1px solid #86efac}
.result-msg.fail{display:block;background:var(--red-bg);color:var(--red);border:1px solid #fca5a5}
.finish{text-align:center;padding:36px 16px}
.finish h2{font-size:1.6rem;margin-bottom:8px;color:#4f46e5}
.finish .score{font-size:1.15rem;font-weight:700;margin:12px 0 8px}
.finish p{color:var(--muted);margin-bottom:20px}
footer{text-align:center;margin-top:28px;font-size:.78rem;color:#94a3b8}
</style>
</head>
<body>
<div class="container">
<header>
<h1>НОК · ГИП (7 уровень)</h1>
<p>Специалист по организации строительства · 411 вопросов</p>
</header>
<div class="progress-wrap">
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="progress-text" id="progressText">0 / 0</div>
</div>
<div class="card" id="quizCard"></div>
<footer>Прогресс сохраняется · только для личного использования</footer>
</div>
<script>
const ALL_QUESTIONS = [{"id": 1, "text": "Какая характеристика объекта капитального строительства в соответствии с проектной документацией НЕ относит его к уникальным объектам?", "options": ["Высота более чем 100 метров", "Пролеты более чем 100 метров", "Высота для ветроэнергетических установок — более чем 200 метров", "Наличие консоли более чем 20 метров", "Заглубление подземной части (полностью или частично) ниже планировочной отметки земли более чем на 15 метров"], "correct": [2]}, {"id": 2, "text": "Кем осуществляется входной контроль рабочей документации на строительство объекта? (несколько ответов)", "options": ["Застройщиком (техническим заказчиком)", "Лицом, осуществляющим подготовку проектной документации", "Лицом, осуществляющим строительство", "Лицом, осуществляющим государственный строительный надзор"], "correct": [0, 2]}, {"id": 3, "text": "При капитальном ремонте объектов капитального строительства (за исключением линейных объектов) НЕ производится:", "options": ["Замена и (или) восстановление строительных конструкций или элементов таких конструкций", "Замена и (или) восстановление систем инженерно-технического обеспечения и сетей инженерно-технического обеспечения", "Восстановление несущих строительных конструкций", "Замена отдельных элементов несущих строительных конструкций на аналогичные"], "correct": [2]}, {"id": 4, "text": "Каким путем осуществляется подтверждение факта соответствия комплектов рабочей документации требованиям действующих нормативных документов и утвержденной проектной документации? (несколько ответов)", "options": ["Визированием ответственного лица застройщика (технического заказчика) (специалиста по организации строительства) и проставления штампа «В производство работ» с датой на каждом листе комплектов рабочей документации", "Выдачей распоряжения о соответствии лицом, осуществляющим государственный строительный надзор", "Изданием приказа «О подтверждении факта соответствия комплектов рабочей документации требованиям действующих нормативных документов и утвержденной проектной документации» лицом, осуществляющим строительство", "Подписанием комплектов рабочей документации электронной подписью специалиста по организации строительства (при согласовании рабочей документации в форме электронных документов или в составе информационной модели)", "Составлением и подписанием акта о соответствии лицом, осуществляющим подготовку проектной документации"], "correct": [0, 3]}, {"id": 5, "text": "Какие понятия включает в себя термин «Реконструкция объектов капитального строительства (за исключением линейных объектов)»? (несколько ответов)", "options": ["Изменение параметров объекта капитального строительства, его частей (высоты, количества этажей, площади, объема)", "Расширение объекта капитального строительства, а также замена и (или) восстановление несущих строительных конструкций объекта капитального строительства", "Надстройка объекта капитального строительства", "Замена систем инженерно-технического обеспечения и сетей инженерно-технического обеспечения объектов капитального строительства или их элементов", "Замена отдельных элементов несущих конструкций на аналогичные или иные улучшающие показатели таких конструкций элементы и (или) восстановления указанных элементов"], "correct": [0, 1, 2]}, {"id": 6, "text": "Какие сведения содержит «Ведомость основных комплектов рабочих чертежей»?", "options": ["Перечень разделов проектной документации, на основании которых выполнены основные комплекты рабочих чертежей", "Последовательный перечень листов основных комплектов, входящих в состав полного комплекта рабочей документации", "Перечень ссылочных и прилагаемых документов, спецификаций, входящих в состав полного комплекта рабочей документации", "Последовательный перечень основных комплектов рабочих чертежей, входящих в состав полного комплекта рабочей документации"], "correct": [3]}, {"id": 7, "text": "Каким минимальным требованиям должно соответствовать заявление физического лица для включения сведений о физическом лице в национальные реестры специалистов? (несколько ответов)", "options": ["Наличие высшего образования по специальности или направлению подготовки в области строительства", "Наличие общего трудового стажа по профессии, специальности или направлению подготовки в области строительства не менее чем десять лет", "Наличие стажа работы на инженерных должностях не менее чем два года в организациях, выполняющих все виды строительной деятельности", "Наличие трудового стажа по профессии на административных должностях не менее чем пять лет"], "correct": [0, 1]}, {"id": 8, "text": "В каком случае допускается выполнение капитального ремонта по проектной документации, не получившей положительное заключение экспертизы, при условии, что сметная стоимость такого капитального ремонта не подлежит проверке на предмет достоверности ее определения?", "options": ["В случае капитального ремонта автомобильной дороги", "В случае капитального ремонта уникального объекта", "В случае капитального ремонта опасного производственного объекта", "В любом случае"], "correct": [3]}, {"id": 9, "text": "Какие сведения включают в состав общих указаний, приводимых в составе общих данных по рабочим чертежам основного комплекта марки АР? (несколько ответов)", "options": ["Класс конструктивной пожарной опасности здания", "Класс функциональной пожарной опасности здания", "Сведения о мероприятиях по антикоррозионной защите конструкций (при отсутствии основного комплекта рабочих чертежей марки А3)", "Сведения о глубине промерзания", "Расчетный срок службы здания (сооружения)"], "correct": [0, 1, 4]}, {"id": 10, "text": "Какие главы, по которым распределяются средства, должен содержать сводный сметный расчет стоимости строительства, выполняемый в составе проектной документации на реконструкцию объекта капитального строительства? (несколько ответов)", "options": ["Объекты транспортного хозяйства и связи (глава 5)", "Благоустройство и озеленение территории (глава 7)", "Временные здания и сооружения (глава 8)", "Содержание службы заказчика, строительный контроль (глава 10)", "Накладные расходы"], "correct": [0, 1, 2, 3]}, {"id": 11, "text": "Какие из нижеперечисленных зданий и сооружений относятся к некапитальным?", "options": ["Строения, сооружения, которые не имеют прочной связи с землей и конструктивные характеристики которых позволяют осуществить их перемещение и (или) демонтаж и последующую сборку без несоразмерного ущерба назначению и без изменения основных характеристик", "Производственные, складские, вспомогательные, жилые и общественные здания и сооружения, необходимые для выполнения строительных работ", "Здания и сооружения, строительство которых не завершено", "Здания и сооружения, не требующие присоединения к сетям инженерно-технического обеспечения"], "correct": [0]}, {"id": 12, "text": "Какое строительство понимается под этапом строительства? (несколько ответов)", "options": ["Строительство объекта капитального строительства из числа объектов капитального строительства, планируемых к строительству на одном земельном участке, если такой объект может быть введен в эксплуатацию и эксплуатироваться автономно", "Строительство части объекта капитального строительства, которая может быть введена в эксплуатацию и эксплуатироваться автономно", "Строительство нескольких объектов капитального строительства на нескольких граничащих друг с другом земельных участках, если такие объекты могут быть введены в эксплуатацию и эксплуатироваться автономно", "Строительство нескольких частей объекта капитального строительства, расположенных на нескольких граничащих друг с другом земельных участках, каждая из которых может быть введена в эксплуатацию и эксплуатироваться автономно"], "correct": [0, 1]}, {"id": 13, "text": "На каком чертеже указываются границы строительной площадки линейных объектов? (несколько ответов)", "options": ["На строительном генеральном плане", "На ситуационном плане", "На плане полосы отвода", "На чертеже планировки территории"], "correct": [1, 2]}, {"id": 14, "text": "На каком чертеже указываются границы строительной площадки нелинейных объектов капитального строительства? (несколько ответов)", "options": ["На строительном генеральном плане", "На ситуационном плане", "На плане полосы отвода", "На чертеже планировки территории"], "correct": [0, 1]}, {"id": 15, "text": "Какие виды саморегулируемых организаций предусмотрены Градостроительным кодексом РФ? (несколько ответов)", "options": ["Саморегулируемые организации, основанные на членстве лиц, выполняющих инженерные изыскания", "Саморегулируемые организации, основанные на членстве лиц, осуществляющих строительство", "Саморегулируемые организации лиц, осуществляющих деятельность в области энергетического обследования", "Саморегулируемые организации кадастровых инженеров"], "correct": [0, 1]}, {"id": 16, "text": "Какой пункт НЕ входит в состав текстовой части раздела «Объемно-планировочные и архитектурные решения» проектной документации объектов капитального строительства производственного и непроизводственного назначения?", "options": ["Описание внешнего вида объекта капитального строительства, описание и обоснование пространственной, планировочной и функциональной организации объекта капитального строительства", "Описание и обоснование использованных композиционных приемов при оформлении фасадов и интерьеров объекта капитального строительства", "Описание и обоснование объемно-планировочных и конструктивных решений, в том числе в части соблюдения предельных параметров разрешенного строительства, реконструкции объекта капитального строительства", "Описание архитектурных решений, обеспечивающих естественное освещение помещений с постоянным пребыванием людей"], "correct": [2]}, {"id": 17, "text": "Какие сведения НЕ содержатся в разделе «Схема планировочной организации земельного участка» проектной документации объектов капитального строительства производственного и непроизводственного назначения?", "options": ["Описание организации рельефа вертикальной планировкой", "Описание решений по благоустройству территории", "Обоснование схем транспортных коммуникаций, обеспечивающих внешний и внутренний подъезд к объекту капитального строительства", "Сведения о прочностных и деформационных характеристиках грунта в основании объекта капитального строительства", "Сводный план сетей инженерно-технического обеспечения с обозначением мест подключения проектируемого объекта капитального строительства к существующим сетям инженерно-технического обеспечения"], "correct": [3]}, {"id": 18, "text": "При каких условиях допускается проектирование с последующим устройством основания здания или сооружения без соответствующего инженерно-геологического обоснования или при его недостаточности?", "options": ["Допускается при малоэтажном строительстве", "Не допускается при любых условиях", "Допускается для каменных зданий с армированными поясами", "Допускается на песчаных грунтах"], "correct": [1]}, {"id": 19, "text": "Какой из перечисленных документов определяет состав проекта организации строительства?", "options": ["Постановление Правительства Российской Федерации от 16.02.2008 № 87 «О составе разделов проектной документации и требованиях к их содержанию»", "СП 48.13330.2019 «СНиП 12-01-2004 Организация строительства» (с изменением 1)", "СНиП 11-01-95 «Инструкция о порядке разработки, согласования, утверждения и составе проектной документации на строительство предприятий, зданий и сооружений»", "Градостроительный кодекс Российской Федерации от 29.12.2004 № 190-ФЗ"], "correct": [0]}, {"id": 20, "text": "Какие сведения не отражаются в составе Проекта организации строительства?", "options": ["Календарный план", "Строительный генеральный план", "Схемы движения транспортных средств на строительной площадке", "Локальные сметы", "Обоснование принятой продолжительности строительства"], "correct": [3]}, {"id": 21, "text": "Какой из перечисленных материалов НЕ содержится в графической части раздела проектной документации «Конструктивные решения» объектов капитального строительства производственного и непроизводственного назначения?", "options": ["Обоснование проектных решений и мероприятий, обеспечивающих пожарную безопасность", "Схемы каркасов и узлов строительных конструкций", "Планы перекрытий, покрытий, кровли", "Схемы расположения ограждающих конструкций и перегородок", "Поэтажные планы зданий и сооружений с указанием размеров и экспликации помещений"], "correct": [0]}, {"id": 22, "text": "Какие методы демонтажа (сноса) устанавливает проект организации работ по демонтажу (сносу)? (несколько ответов)", "options": ["Комплексное обрушение", "Механический", "Поэлементный", "Поэтапное понижение", "Термический"], "correct": [1, 3, 4]}, {"id": 23, "text": "В какой документации обосновывается потребность строительства в основных строительных машинах, механизмах?", "options": ["Проект благоустройства", "Проект организации строительства", "Проект организации дорожного движения", "Рабочая документация"], "correct": [1]}, {"id": 24, "text": "Какие параметры НЕ входят в состав текстовой части Проекта организации строительства, разрабатываемого для объектов капитального строительства производственного и непроизводственного назначения? (несколько ответов)", "options": ["Обоснование потребности строительства, реконструкции, капитального ремонта в кадрах, основных строительных машинах, механизмах, транспортных средствах, в топливе и горюче-смазочных материалах, а также в электрической энергии, паре, воде, временных зданиях и сооружениях", "Описание особенностей проведения работ в условиях действующего предприятия, в местах расположения подземных коммуникаций, линий электропередачи и связи", "Описание транспортной схемы (схем) доставки материально-технических ресурсов с указанием мест расположения станций и пристаней разгрузки, промежуточных складов и временных подъездных дорог, в том числе временной дороги вдоль линейного объекта", "Перечень видов строительных и монтажных работ, ответственных конструкций, участков сетей инженерно-технического обеспечения, подлежащих освидетельствованию с составлением соответствующих актов приемки перед производством последующих работ и устройством последующих конструкций", "Указание мест обхода или преодоления специальными средствами естественных препятствий и преград, переправ на водных объектах"], "correct": [2, 4]}, {"id": 25, "text": "На основании каких критериев устанавливается класс сооружения? (несколько ответов)", "options": ["Методологические последствия их повреждений и разрушений", "Социальные последствия их повреждений и разрушений", "Экологические последствия их повреждений и разрушений", "Экономические последствия их повреждений и разрушений", "Теоретические последствия их повреждений и разрушений"], "correct": [1, 2, 3]}, {"id": 26, "text": "Какое из определений соответствует термину «Моральный износ здания»?", "options": ["Постепенное (во времени) отклонение основных эксплуатационных показателей от современного уровня технических требований эксплуатации зданий и сооружений", "Ухудшение технических и связанных с ними эксплуатационных показателей здания, вызванное объективными причинами", "Степень эксплуатационной пригодности здания", "Категория технического состояния, отражающая соответствие установленным в проектной документации значениям параметров"], "correct": [0]}, {"id": 27, "text": "Какое из определений соответствует термину «Физический износ здания»?", "options": ["Степень эксплуатационной пригодности здания", "Постепенное (во времени) отклонение основных эксплуатационных показателей от современного уровня технических требований эксплуатации зданий и сооружений", "Категория технического состояния, отражающая соответствие установленным в проектной документации значениям параметров", "Ухудшение технических и связанных с ними эксплуатационных показателей здания, вызванное объективными причинами *"], "correct": [3]}, {"id": 28, "text": "Какое из определений соответствует термину «Кляммер»?", "options": ["Гофрированные листовые профили, соединённые между собой по продольным кромкам и закреплённые на опорных конструкциях крыши", "Место пересечения сходящихся скатов покрытия, по которому стекает вода", "Металлическая деталь в виде узкой полосы для крепления фальцевой кровли из металлических рулонных и листовых материалов к сплошному настилу или обрешетке", "Металлический лист с регулярно расположенными продольными гофрами, образованными в процессе холодной прокатки листа на профилегибочном стане", "Ребро крыши, образованное расходящимися ее скатами"], "correct": [2]}, {"id": 29, "text": "Какого подраздела НЕ существует в составе раздела проектной документации «Сведения об инженерном оборудовании, о сетях и системах инженерно-технического обеспечения» объектов капитального строительства производственного и непроизводственного назначения?", "options": ["«Система электроснабжения»", "«Система водоснабжения»", "«Система водоотведения»", "«Технологические решения»", "«Сети связи»"], "correct": [3]}, {"id": 30, "text": "Какое из определений соответствует термину «Пароизоляционный слой»?", "options": ["Слой кровельного рулонного материала, укладываемого на сплошной настил для защиты его от увлажнения и повышения водонепроницаемости кровли", "Слой из рулонных или мастичных материалов, расположенный в ограждающей конструкции для предохранения ее от воздействия водяных паров, содержащихся в воздухе ограждаемого помещения", "Слой, укладываемый на водоизоляционный ковер для защиты его от повреждения корнями растений", "Слой, располагаемый между основным водоизоляционным ковром или теплоизоляцией и защитным слоем"], "correct": [1]}, {"id": 31, "text": "Каким специалистом исполняется должностная обязанность по утверждению подтверждения соответствия вносимых в проектную документацию в процессе строительства изменений, не влекущих за собой изменение класса, категории и (или) первоначально установленных показателей функционирования линейных объектов?", "options": ["Специалистом по организации архитектурно-строительного проектирования в должности главного инженера проекта", "Специалистом по организации строительства в должности главного инженера проекта", "Специалистом по организации инженерных изысканий в должности главного инженера проекта", "Специалистом по организации архитектурно-строительного проектирования в должности главного архитектора проекта", "Специалистом по организации и проведению экспертизы проектной документации в должности главного эксперта"], "correct": [0]}, {"id": 32, "text": "Какая документация определяет инженерно-технические решения для обеспечения реконструкции объектов капитального строительства?", "options": ["Проектная документация", "Рабочая документация", "Техническая документация", "Исполнительная документация", "Нормативная документация"], "correct": [0]}, {"id": 33, "text": "В каком случае не требуется подготовка проектной документации, если сметная стоимость строительства не подлежит проверке на предмет достоверности ее определения?", "options": ["При строительстве, реконструкции сооружения класса КС-3", "В случае, если сметная стоимость строительства не подлежит оценке достоверности сметной стоимости", "При строительстве, реконструкции объекта индивидуального жилищного строительства", "При капитальном ремонте", "По решению застройщика, технического заказчика, лица, ответственного за эксплуатацию здания, сооружения, регионального оператора"], "correct": [2]}, {"id": 34, "text": "В каком случае проектная документация должна включать раздел «Смета на строительство, реконструкцию, капитальный ремонт, снос объекта капитального строительства»?", "options": ["В случае, если строительство, реконструкция, снос финансируются с привлечением средств бюджетов бюджетной системы Российской Федерации", "В случае, если подготовка проектной документации осуществляется для объектов повышенного уровня ответственности", "В случае, если стоимость строительства превышает 100 млн рублей", "В случае, если проектная документация подлежит экспертизе проектной документации", "В любом случае"], "correct": [0]}, {"id": 35, "text": "За какое минимальное количество рабочих дней до начала строительства, реконструкции, капитального ремонта объекта капитального строительства в орган государственного строительного надзора (в случае, если его проведение предусмотрено) направляется извещение о начале работ?", "options": ["Не позднее чем за 5 рабочих дней", "Не позднее чем за 7 рабочих дней", "Не позднее чем за 10 рабочих дней", "Не позднее чем за 14 рабочих дней"], "correct": [1]}, {"id": 36, "text": "Какой установлен срок исковой давности требований, предъявляемых в связи с ненадлежащим качеством работы, выполненной по договору подряда, в отношении зданий и сооружений?", "options": ["1 год", "2 года", "3 года  (ст. 725 ГК РФ)", "5 лет"], "correct": [2]}, {"id": 37, "text": "В каких случаях подрядчик обязан немедленно предупредить заказчика и до получения от него указаний приостановить работу? (несколько ответов)", "options": ["При обнаружении возможных неблагоприятных для заказчика последствий выполнения его указаний о способе исполнения работы", "При отсутствии в договоре подряда обязанности по страхованию, возникновении риска случайной гибели или случайного повреждения объекта строительства", "При обнаружении непригодности или недоброкачественности предоставленных заказчиком материала, оборудования, технической документации или переданной для переработки (обработки) вещи", "При обнаружении не зависящих от подрядчика обстоятельств, которые грозят годности или прочности результатов выполняемой работы либо создают невозможность её завершения в срок  (ст. 716 ГК РФ)"], "correct": [0, 2, 3]}, {"id": 38, "text": "При каком условии подрядчик может потребовать оплаты выполненной работы, если результат оказался с недостатками, непригодными для использования, по причине некачественных материалов, предоставленных заказчиком?", "options": ["Может при любых условиях", "Не может при любых условиях", "Может при условии предоставления гарантийных обязательст  2 ст. 52 ГрК РФ)", "Органом ГСН", "Органом местного самоуправления"], "correct": [1]}, {"id": 406, "text": "В каком случае допускается выполнение следующих работ без освидетельствования предыдущих скрытых работ?", "options": ["Ни в каком случае  (ч. 5 ст. 52 ГрК РФ)", "При согласии подрядчика", "При сжатых сроках строительства", "При письменном уведомлении органа ГСН"], "correct": [0]}, {"id": 407, "text": "Кем оформляются акты освидетельствования скрытых работ при участии органа государственного строительного надзора?", "options": ["Только подрядчиком", "Подрядчиком с участием органа ГСН  (ч. 5 ст. 52 ГрК РФ)", "Органом местного самоуправления", "Ростехнадзором"], "correct": [1]}, {"id": 408, "text": "В течение какого срока орган ГСН должен провести проверку при получении извещения о сроках завершения работ, влияющих на безопасность?", "options": ["В течение 5 рабочих дней  (ч. 5.1 ст. 54 ГрК РФ)", "В течение 10 рабочих дней", "В течение 15 рабочих дней", "Срок не установлен"], "correct": [0]}, {"id": 409, "text": "Каким образом оформляется несоответствие выполняемых работ требованиям технических регламентов?", "options": ["Записью в общем журнале работ без официального документа", "Актом о несоответствии выполняемых работ требованиям технических регламентов  (СП 48.13330)", "Письмом подрядчику", "Устным замечанием производителя работ"], "correct": [1]}, {"id": 410, "text": "Какой итоговый документ составляется при завершении строительства до подачи заявления на разрешение на ввод?", "options": ["Акт итоговой проверки объекта  (ч. 4 ст. 54 ГрК РФ)", "Протокол совещания у руководителя органа ГСН", "Справка о выполненных работах", "Дефектная ведомость"], "correct": [0]}, {"id": 411, "text": "С кого момента начинается отсчёт эксплуатационных гарантий по договору строительного подряда, если гарантийный срок установлен?", "options": ["С даты начала строительных работ", "С момента, когда результат работ принят заказчиком  (ст. 755 ГК РФ)", "С даты выдачи разрешения на с const STORAGE_KEY = 'nok_gip_quiz_v4';

let state = { mode:'main', current:0, answered:{}, wrongIds:[], queue:[] };

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      state.current=p.current||0;
      state.answered=p.answered||{};
      state.wrongIds=p.wrongIds||[];
      state.mode=p.mode||'main';
      state.queue=p.queue||ALL_QUESTIONS.map(q=>q.id);
    } else state.queue=ALL_QUESTIONS.map(q=>q.id);
  }catch(e){ state.queue=ALL_QUESTIONS.map(q=>q.id); }
  if(state.current>=state.queue.length) state.current=Math.max(0,state.queue.length-1);
}
function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
    current:state.current, answered:state.answered, wrongIds:state.wrongIds,
    mode:state.mode, queue:state.queue
  }));
}
function getQById(id){ return ALL_QUESTIONS.find(q=>q.id===id); }

const card=document.getElementById('quizCard');
const progressFill=document.getElementById('progressFill');
const progressText=document.getElementById('progressText');

function updateProgress(){
  const total=state.queue.length, done=state.current;
  progressFill.style.width=(total?Math.round(done/total*100):0)+'%';
  progressText.textContent=done+' / '+total+' · '+(state.mode==='retry'?'Повтор ошибок':'Основной');
}

function render(){
  updateProgress();
  if(state.current>=state.queue.length){
    const correctCount=Object.keys(state.answered).length;
    const totalAll=ALL_QUESTIONS.length;
    const wrongs=state.wrongIds.filter(id=>!state.answered[id]);
    if(state.mode==='main' && wrongs.length>0){
      card.innerHTML=`<div class="finish"><h2>Основной проход завершён</h2>
        <div class="score">Правильно: ${correctCount} из ${totalAll}</div>
        <p>Ошибок: <strong>${wrongs.length}</strong></p>
        <div class="actions" style="justify-content:center">
          <button class="btn-retry-batch" onclick="startRetry()">Прорешать ошибочные (${wrongs.length})</button>
          <button class="btn-secondary" onclick="resetAll()">Начать всё заново</button>
        </div></div>`;
      return;
    }
    card.innerHTML=`<div class="finish"><h2>${state.mode==='retry'?'Повтор завершён!':'Все вопросы пройдены!'}</h2>
      <div class="score">Правильно: ${correctCount} / ${totalAll}</div>
      <p>${wrongs.length?'Ещё остались ошибки.':'Отличный результат!'}</p>
      <div class="actions" style="justify-content:center">
        ${wrongs.length?`<button class="btn-retry-batch" onclick="startRetry()">Прорешать ошибочные (${wrongs.length})</button>`:''}
        <button class="btn-primary" onclick="resetAll()">Начать всё заново</button>
      </div></div>`;
    return;
  }
  const qid=state.queue[state.current];
  const q=getQById(qid);
  if(!q){ state.current++; render(); return; }
  const isMulti=q.correct.length>1;
  const type=isMulti?'checkbox':'radio';
  const name='opt_'+q.id;
  let optionsHtml=q.options.map((opt,i)=>`
    <label class="option" data-idx="${i}">
      <input type="${type}" name="${name}" value="${i}">
      <span>${opt}</span>
    </label>`).join('');
  card.innerHTML=`
    <div class="q-num">${state.mode==='retry'?'Повтор · ':''}Вопрос ${state.current+1} из ${state.queue.length}</div>
    <div class="q-text">${q.text}</div>
    <div class="options">${optionsHtml}</div>
    ${isMulti?'<div class="hint">Можно выбрать несколько вариантов</div>':''}
    <div class="result-msg" id="resultMsg"></div>
    <div class="actions">
      <button class="btn-primary" id="checkBtn" onclick="checkAnswer()">Проверить</button>
      <button class="btn-secondary" id="nextBtn" style="display:none" onclick="nextQuestion()">Далее →</button>
    </div>`;
}

function checkAnswer(){
  const qid=state.queue[state.current];
  const q=getQById(qid);
  const inputs=card.querySelectorAll('input');
  const selected=[];
  inputs.forEach(inp=>{ if(inp.checked) selected.push(+inp.value); });
  if(!selected.length){ alert('Выберите хотя бы один вариант'); return; }
  const sel=[...selected].sort((a,b)=>a-b);
  const cor=[...q.correct].sort((a,b)=>a-b);
  const isCorrect=sel.length===cor.length && sel.every((v,i)=>v===cor[i]);
  card.querySelectorAll('.option').forEach(lab=>{
    lab.classList.add('disabled');
    const idx=+lab.dataset.idx;
    const wasSel=selected.includes(idx);
    const isRight=q.correct.includes(idx);
    if(isRight) lab.classList.add('correct');
    else if(wasSel) lab.classList.add('wrong');
  });
  const msg=document.getElementById('resultMsg');
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='inline-block';
  if(isCorrect){
    msg.className='result-msg ok'; msg.textContent='Верно!';
    state.answered[q.id]=true;
    state.wrongIds=state.wrongIds.filter(id=>id!==q.id);
  } else {
    msg.className='result-msg fail'; msg.textContent='Неверно';
    if(!state.wrongIds.includes(q.id)) state.wrongIds.push(q.id);
  }
  saveState(); updateProgress();
}
function nextQuestion(){ state.current++; saveState(); render(); }
function startRetry(){
  const wrongs=state.wrongIds.filter(id=>!state.answered[id]);
  if(!wrongs.length){ alert('Нет ошибочных вопросов'); return; }
  state.mode='retry'; state.queue=[...wrongs]; state.current=0;
  saveState(); render();
}
function resetAll(){
  if(!confirm('Сбросить весь прогресс и начать сначала?')) return;
  state={mode:'main',current:0,answered:{},wrongIds:[],queue:ALL_QUESTIONS.map(q=>q.id)};
  saveState(); render();
}
loadState(); render();
</script>
